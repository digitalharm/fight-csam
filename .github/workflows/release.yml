name: Release

# Publishes all packages when a version tag is pushed (e.g. v0.1.0).
#
# PREREQUISITES (one-time, set by a maintainer — see docs/ops/release-runbook.md):
#   Repository secrets:
#     CARGO_REGISTRY_TOKEN  — crates.io API token (scope: publish-new, publish-update)
#     PYPI_API_TOKEN        — PyPI token (or use Trusted Publishing; see runbook)
#     NPM_TOKEN             — npm automation token with publish rights to @digitalharm
#   Name collisions are RESOLVED: the crate publishes as `digitalharm-hashkit`
#   and the Python dist as `digitalharm-promptshield` (see runbook §A1). The
#   owner must still OWN the `@digitalharm` npm org before the node job can publish.
#
# This workflow is intentionally manual-trigger-able too (workflow_dispatch) so a
# maintainer can dry-run the build jobs without tagging.

on:
  push:
    tags:
      - "v*"                 # coordinated Rust/Python/npm release tag (e.g. v0.1.0)
      - "packages/*/v*"      # Go per-module tags (e.g. packages/hashstream/v0.1.0)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Rust
  rust:
    name: crates.io
    runs-on: ubuntu-latest
    # Only on the coordinated release tag (v*) or a manual run — never on a
    # Go-only `packages/*/v*` tag (which carries no crates.io credentials need).
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package (always) + publish (on tag)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # All control inputs come in via env (no ${{ }} interpolation inside run:).
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # Dependency order: hashkit must be on the index before hashkit-match.
          ORDER="digitalharm-hashkit hashkit-match c2pa-lite safemod"
          for c in $ORDER; do
            if [ "${DRY_RUN:-false}" = "true" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::group::cargo package $c (dry-run)"
              cargo package -p "$c"
              echo "::endgroup::"
            else
              echo "::group::cargo publish $c"
              cargo publish -p "$c"
              echo "::endgroup::"
              # Give the index a moment so the next crate can resolve the dep.
              sleep 30
            fi
          done

  # ---------------------------------------------------------------- Python
  python:
    name: PyPI · ${{ matrix.package }}
    runs-on: ubuntu-latest
    # Coordinated release tag (v*) or manual run only — not Go-only tags.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - detectkit-test
          - promptshield
          - trainguard
          - csam-shield/python
          - cybertip-cli/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + check
        working-directory: packages/${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Publish (on tag only)
        if: github.event_name == 'push'
        working-directory: packages/${{ matrix.package }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  # ---------------------------------------------------------------- Node
  node:
    name: npm · ${{ matrix.package }}
    runs-on: ubuntu-latest
    # Coordinated release tag (v*) or manual run only — not Go-only tags.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - csam-shield/node
          - cybertip-cli/node
          - hashstream/sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Build + pack
        working-directory: packages/${{ matrix.package }}
        run: |
          npm install --no-audit --no-fund
          npx tsc
          npm pack --dry-run
      - name: Publish (on tag only)
        if: github.event_name == 'push'
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  # ---------------------------------------------------------------- Go
  # Go modules are published by the existence of a semver tag — pkg.go.dev
  # indexes them on first request. Nudge the proxy so they appear promptly.
  go:
    name: Go proxy warm-up
    # Fires on the per-module Go tags (packages/<m>/vX.Y.Z). Go "publishes" via
    # the tag itself; this job just warms the proxy so pkg.go.dev indexes promptly.
    if: ${{ startsWith(github.ref, 'refs/tags/packages/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Request modules from the Go proxy
        run: |
          set -e
          # Go modules in this repo have NO root go.mod — each lives at
          # packages/<m>/go.mod with module path .../packages/<m>. The Go
          # toolchain therefore ONLY recognizes per-module version tags of the
          # form `packages/<m>/vX.Y.Z`; a bare `vX.Y.Z` tag resolves to a
          # nonexistent root module and silently publishes nothing.
          VERSION="v0.1.0"   # bump per release; both modules share the launch version
          for m in hashstream evidencevault; do
            MODTAG="packages/$m/$VERSION"
            echo "Requesting github.com/digitalharm/digitalharm-oss/packages/$m@$MODTAG"
            GOPROXY=https://proxy.golang.org go list -m \
              "github.com/digitalharm/digitalharm-oss/packages/$m@$MODTAG" || \
              echo "  (proxy will index on first real fetch)"
          done
