[package]
name = "c2pa-lite"
description = "Pragmatic C2PA content credentials for AI image and video generators. Watermark + signed manifest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Pull in upstream c2pa-rs for production-grade signing. Off by default so
# the scaffold stays lightweight; flip on once the integration lands.
upstream = []

[dependencies]
thiserror = "1"
# Real Ed25519 signing of the canonical manifest claim. Lightweight,
# pure-Rust, no native deps — safe to compile on every CI run. The full
# C2PA manifest embedding (JWS via c2pa-rs) stays behind the `upstream`
# feature.
ed25519-dalek = "2"
# Future:
#   c2pa = { version = "0.85", optional = true } behind `upstream`
#   serde + serde_json for manifest serialization
