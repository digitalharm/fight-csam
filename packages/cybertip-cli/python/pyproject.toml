[project]
name = "cybertip-cli"
version = "0.1.0"
description = "NCMEC CyberTipline report submission CLI and library. Counsel-reviewed scope; production submission gated."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "The Digital Harm Report contributors" }]
keywords = ["csam", "ncmec", "cybertipline", "trust-and-safety", "2258a"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://digitalharm.org/tools"
Repository = "https://github.com/digitalharm/digitalharm-oss"
"Counsel scope" = "https://github.com/digitalharm/digitalharm-oss/blob/main/packages/cybertip-cli/docs/counsel-scope-brief.md"

[project.scripts]
cybertip = "cybertip_cli.cli:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybertip_cli"]
