[project]
name = "digitalharm-promptshield"
version = "0.1.0"
description = "CSAM-intent detection at the prompt for AI image and video generators. Drop-in middleware for Stable Diffusion, FLUX, ComfyUI, vLLM."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "The Digital Harm Report contributors" }]
keywords = ["csam", "trust-and-safety", "ai-safety", "prompt-classifier", "stable-diffusion", "vllm"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
neural = ["transformers>=4.40", "torch>=2"]
onnx = ["onnxruntime>=1.18"]
diffusers = ["diffusers>=0.27"]
vllm = ["vllm>=0.4"]

[project.urls]
Homepage = "https://digitalharm.org/tools"
Repository = "https://github.com/digitalharm/digitalharm-oss"
"Safety policy" = "https://github.com/digitalharm/digitalharm-oss/blob/main/docs/safety-policy.md"

[project.scripts]
promptshield = "promptshield.cli:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptshield"]
