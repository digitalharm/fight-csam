[package]
name = "hashkit"
description = "PDQ and TMK+PDQF perceptual hashing with NCMEC-verified conformance vectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable WebAssembly bindings (wasm-bindgen). Pulls in extra deps; off by default
# so the native build stays lean.
wasm = []

[dependencies]
thiserror = "1"
# Real PDQ implementation. We call through pdqhash's re-exported `image`
# crate (pdqhash::image) rather than depending on `image` directly, so the
# DynamicImage type always matches the version pdqhash was built against
# (avoids the image 0.23-vs-0.25 DynamicImage type-mismatch trap).
pdqhash = "0.1"

# Still to add as the port deepens:
#   - serde + serde_json for the vector suite / corpus format (v1.0)
#   - wasm-bindgen behind the `wasm` feature (v1.0)

[dev-dependencies]
# proptest, criterion, and the vector-conformance harness deps go here.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
